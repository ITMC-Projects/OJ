{% extends "base.html" %}
{% block body %}
    <p>{{ _('Your password was successfully changed.') }}</p>
    {% if not request.user.is_authenticated %}
        <p>Mật khẩu đã được cập nhật tại OTS. Vui lòng đăng nhập lại.</p>
        <a href="{{ url('auth_login') }}">Đăng nhập</a>
    {% endif %}
{% endblock %}
